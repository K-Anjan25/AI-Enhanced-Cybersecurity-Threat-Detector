# AEGIS local development stack (T-005).
#
#   docker compose -f docker/docker-compose.yml up
#
# Everything binds inside the compose network; only the three AEGIS services
# publish ports. Datasets are NOT baked into any image (R-40).
#
# AEGIS_SECRET_KEY must come from the environment or a .env file next to this
# compose file — it is deliberately not given a default here (R-50). Generate one:
#   python -c "import secrets; print(secrets.token_urlsafe(48))"
# AEGIS_DEV_AUTH_SETUP_ENABLED is false by default. Set it to true only on a
# private development stack to allow one operator-chosen, in-memory first account:
#   AEGIS_DEV_AUTH_SETUP_ENABLED=true docker compose -f docker/docker-compose.yml up

name: aegis

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: aegis
      POSTGRES_DB: aegis
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U aegis -d aegis']
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - '5432:5432'

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    # `bitnami/kafka` no longer exists: Broadcom deleted the public
    # docker.io/bitnami catalog on 2025-09-29, and the Docker Hub API now returns
    # zero tags for the repository. `bitnamilegacy` is the archive the versioned
    # tags were moved to, and it is a drop-in - same KAFKA_CFG_* variables, same
    # /bitnami/kafka data directory - so nothing else in this block changes.
    #
    # It is frozen and receives no CVE patches, which is a poor fit for a
    # security product; migrating to the official apache/kafka is Q-08. That needs
    # KAFKA_* variables, a different data directory and a KRaft cluster id, and it
    # cannot be verified without a Docker daemon.
    #
    # This service is NOT behind a profile. `backend` depends_on it with
    # condition: service_healthy, and compose rejects a dependency on a service
    # whose profile is not enabled - an earlier attempt to profile this took the
    # whole project down with "depends on undefined service kafka".
    image: bitnamilegacy/kafka:3.9
    environment:
      # Single-node KRaft; no ZooKeeper needed for local development.
      KAFKA_CFG_NODE_ID: '0'
      KAFKA_CFG_PROCESS_ROLES: 'controller,broker'
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: '0@kafka:9093'
      KAFKA_CFG_LISTENERS: 'PLAINTEXT://:9092,CONTROLLER://:9093'
      KAFKA_CFG_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9092'
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT'
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: 'true'
    volumes:
      - kafka-data:/bitnami/kafka
    healthcheck:
      test: ['CMD-SHELL', 'kafka-topics.sh --bootstrap-server localhost:9092 --list']
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    environment:
      discovery.type: single-node
      # Development only. Production must enable security (architecture.md §12).
      xpack.security.enabled: 'false'
      ES_JAVA_OPTS: '-Xms512m -Xmx512m'
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -fs http://localhost:9200/_cluster/health || exit 1']
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 40s

  ml-service:
    build:
      context: ../ml-service
    environment:
      AEGIS_ENV: development
      AEGIS_LOG_LEVEL: INFO
    ports:
      - '8001:8001'
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8001/internal/healthz', timeout=3).status==200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  backend:
    build:
      context: ../backend
    environment:
      AEGIS_ENV: development
      AEGIS_SERVICE_NAME: aegis-backend
      AEGIS_SECRET_KEY: ${AEGIS_SECRET_KEY:?set AEGIS_SECRET_KEY to a random value of at least 32 characters}
      AEGIS_DEV_AUTH_SETUP_ENABLED: ${AEGIS_DEV_AUTH_SETUP_ENABLED:-false}
      AEGIS_DATABASE_URL: postgresql+psycopg://aegis:aegis@postgres:5432/aegis
      AEGIS_ML_SERVICE_URL: http://ml-service:8001
      AEGIS_HOST: 0.0.0.0
      AEGIS_PORT: '8000'
      AEGIS_LOG_LEVEL: INFO
    ports:
      - '8000:8000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      ml-service:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz', timeout=3).status==200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  dashboard:
    build:
      context: ../dashboard
    ports:
      - '8080:8080'
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:8080/ >/dev/null || exit 1']
      interval: 10s
      timeout: 5s
      retries: 6

  # Network capture service — captures REAL traffic from the host network.
  # Requires: --cap-add=NET_ADMIN or --privileged
  # Override interface with: AEGIS_CAPTURE_INTERFACE=Wi-Fi docker compose up
  capture:
    build:
      context: ../backend
      dockerfile: app/services/capture/Dockerfile
    environment:
      AEGIS_API_URL: http://localhost:8000
      AEGIS_EMAIL: admin@aegis.local
      AEGIS_PASSWORD: admin123456789
      AEGIS_CAPTURE_INTERFACE: ${AEGIS_CAPTURE_INTERFACE:-any}
      AEGIS_FLUSH_INTERVAL: "10"
    network_mode: host
    depends_on:
      backend:
        condition: service_healthy
    cap_add:
      - NET_ADMIN
    restart: unless-stopped

  # Zeek network analyzer — deep protocol analysis + flow logging
  # Produces conn.log with detailed connection metadata
  zeek:
    build:
      context: ../backend
      dockerfile: app/services/capture/Dockerfile.zeek
    environment:
      AEGIS_API_URL: http://localhost:8000
      AEGIS_EMAIL: admin@aegis.local
      AEGIS_PASSWORD: admin123456789
      AEGIS_CAPTURE_INTERFACE: ${AEGIS_CAPTURE_INTERFACE:-eth0}
    network_mode: host
    depends_on:
      backend:
        condition: service_healthy
    cap_add:
      - NET_ADMIN
    restart: unless-stopped

  # Suricata IDS — signature-based threat detection
  # Produces eve.json with alerts, flows, DNS events
  suricata:
    build:
      context: ../backend
      dockerfile: app/services/capture/Dockerfile.suricata
    environment:
      AEGIS_API_URL: http://localhost:8000
      AEGIS_EMAIL: admin@aegis.local
      AEGIS_PASSWORD: admin123456789
      AEGIS_CAPTURE_INTERFACE: ${AEGIS_CAPTURE_INTERFACE:-eth0}
    network_mode: host
    depends_on:
      backend:
        condition: service_healthy
    cap_add:
      - NET_ADMIN
    restart: unless-stopped

  # tshark packet capture — lightweight packet-level flow extraction
  tshark:
    build:
      context: ../backend
      dockerfile: app/services/capture/Dockerfile.tshark
    environment:
      AEGIS_API_URL: http://localhost:8000
      AEGIS_EMAIL: admin@aegis.local
      AEGIS_PASSWORD: admin123456789
      AEGIS_CAPTURE_INTERFACE: ${AEGIS_CAPTURE_INTERFACE:-any}
    network_mode: host
    depends_on:
      backend:
        condition: service_healthy
    cap_add:
      - NET_ADMIN
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  kafka-data:
  es-data:
