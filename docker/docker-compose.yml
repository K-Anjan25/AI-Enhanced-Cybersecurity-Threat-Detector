# AEGIS local development stack (T-005).
#
#   docker compose -f docker/docker-compose.yml up
#
# Everything binds inside the compose network; only the three AEGIS services
# publish ports. Datasets are NOT baked into any image (R-40).
#
# AEGIS_SECRET_KEY must come from the environment or a .env file next to this
# compose file — it is deliberately not given a default here (R-50). Generate one:
#   python -c "import secrets; print(secrets.token_urlsafe(48))"
# AEGIS_DEV_AUTH_SETUP_ENABLED is false by default. Set it to true only on a
# private development stack to allow one operator-chosen, in-memory first account:
#   AEGIS_DEV_AUTH_SETUP_ENABLED=true docker compose -f docker/docker-compose.yml up

name: aegis

services:
  postgres:
    mem_limit: 512m
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: aegis
      POSTGRES_DB: aegis
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U aegis -d aegis']
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      # Host port 5433: a PostgreSQL installed on Windows often holds 5432.
      - '5433:5432'

  # Shared, memory-capped state for the backend (login throttle across replicas).
  # Redis is not a telemetry bus (memory.md, Kafka decision): it holds only expiring
  # counters, so eviction under pressure is harmless. The backend starts without it
  # and falls back to a per-process limit, so this is a soft dependency.
  redis:
    mem_limit: 96m
    image: redis:7-alpine
    # No persistence: every key is a time-limited counter. volatile-ttl evicts only
    # keys that have an expiry, which every AEGIS key has, so nothing else is lost.
    command:
      [
        'redis-server',
        '--maxmemory',
        '64mb',
        '--maxmemory-policy',
        'volatile-ttl',
        '--save',
        '',
        '--appendonly',
        'no',
      ]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    # 512m: the native image has no JVM heap, so it needs far less than the JVM image did.
    mem_limit: 512m
    # Native build of Apache Kafka 3.9.0 (GraalVM, no JVM). 47.7 MB compressed, against
    # 207.6 MB for apache/kafka:3.9.0, which bundles a JVM. Same KAFKA_* configuration.
    # Official Apache Kafka image (Q-08). The earlier bitnamilegacy/kafka:3.9 was
    # frozen and unpatched. This image is configured with KAFKA_* variables and
    # runs as a single-node KRaft cluster (no ZooKeeper). Its data lives in
    # /var/lib/kafka/data, on a new volume, because the Bitnami data directory
    # and its cluster id are not compatible with this image.
    #
    # Not verified against a running broker in this repository (no Docker daemon
    # was available when this was written). Run `docker compose up kafka` and
    # check the healthcheck before relying on it.
    #
    # This service is NOT behind a profile. `backend` depends_on it with
    # condition: service_healthy, and compose rejects a dependency on a service
    # whose profile is not enabled - an earlier attempt to profile this took the
    # whole project down with "depends on undefined service kafka".
    image: apache/kafka-native:3.9.0
    environment:
      KAFKA_NODE_ID: '1'
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
      KAFKA_LISTENERS: 'PLAINTEXT://:9092,CONTROLLER://:9093'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_LOG_DIRS: '/var/lib/kafka/data'
      # Topics are created explicitly by the backend at startup (ensure_topic), with the
      # partition count the producer assumes. Auto-create would give flows.raw the broker
      # default (one partition), and src_ip partitioning would silently do nothing.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_NUM_PARTITIONS: '6'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: '1'
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: '1'
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: '1'
      # Fixed cluster id for this single local node. The volume below stores it.
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    volumes:
      - kafka-kraft-data:/var/lib/kafka/data
    healthcheck:
      test: ['CMD-SHELL', '/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list']
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  ml-service:
    mem_limit: 1536m
    build:
      context: ../ml-service
    environment:
      AEGIS_ENV: development
      # Shared secret between the backend and the ML service. Without it the ML service
      # answers 503 on /models and scoring, so the model registry stays empty.
      AEGIS_ML_SERVICE_TOKEN: ${AEGIS_ML_SERVICE_TOKEN:?set AEGIS_ML_SERVICE_TOKEN in docker/.env (see .env.example)}
      AEGIS_LOG_LEVEL: INFO
    # The trained FlowNet checkpoint (data/checkpoints/flownet, not in Git). Without it the
    # service runs, reports no flow model, and the backend scores with rules only.
    volumes:
      - ../data/checkpoints/flownet:/models/flownet:ro
    ports:
      - '8001:8001'
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8001/internal/healthz', timeout=3).status==200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  backend:
    mem_limit: 768m
    build:
      context: ../backend
      additional_contexts:
        aegis_ml: ../ml-service
    environment:
      AEGIS_ENV: development
      # Shared secret between the backend and the ML service. Without it the ML service
      # answers 503 on /models and scoring, so the model registry stays empty.
      AEGIS_ML_SERVICE_TOKEN: ${AEGIS_ML_SERVICE_TOKEN:?set AEGIS_ML_SERVICE_TOKEN in docker/.env (see .env.example)}
      AEGIS_SERVICE_NAME: aegis-backend
      AEGIS_SECRET_KEY: ${AEGIS_SECRET_KEY:?set AEGIS_SECRET_KEY to a random value of at least 32 characters}
      AEGIS_DEV_AUTH_SETUP_ENABLED: ${AEGIS_DEV_AUTH_SETUP_ENABLED:-false}
      AEGIS_DATABASE_URL: postgresql+psycopg://aegis:aegis@postgres:5432/aegis
      AEGIS_ML_SERVICE_URL: http://ml-service:8001
      # Shared login throttle (see app/services/login_throttle.py). Empty = per process.
      AEGIS_REDIS_URL: redis://redis:6379/0
      # The flow path runs over the broker (D-085): ingest publishes to flows.raw and
      # the live consumer scores it. Empty would keep scoring in-process.
      AEGIS_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # The eval@2 report sits beside the checkpoint; the registrar attaches it to the model.
      AEGIS_ML_EVAL_REPORTS_DIR: /models/flownet
      AEGIS_HOST: 0.0.0.0
      AEGIS_PORT: '8000'
      AEGIS_LOG_LEVEL: INFO
      # Seeds the first admin the capture services log in as. The default is a
      # local-development credential; override both with a .env file or the shell.
      AEGIS_BOOTSTRAP_ADMIN_EMAIL: ${AEGIS_BOOTSTRAP_ADMIN_EMAIL:-admin@aegis.local}
      # Self-service viewer signup (/sign-up). On for this local stack; it only ever creates
      # viewers. Render and Helm leave it off: a public deployment must opt in.
      AEGIS_SIGNUP_ENABLED: ${AEGIS_SIGNUP_ENABLED:-true}
      # The assistant: "rules" needs no model. "openai" calls a model server on your machine;
      # see docs/assistant.md (Docker Desktop resolves host.docker.internal).
      AEGIS_ASSISTANT_BACKEND: ${AEGIS_ASSISTANT_BACKEND:-rules}
      AEGIS_ASSISTANT_BASE_URL: ${AEGIS_ASSISTANT_BASE_URL:-http://host.docker.internal:11434/v1}
      AEGIS_ASSISTANT_MODEL: ${AEGIS_ASSISTANT_MODEL:-qwen2.5:1.5b}
      AEGIS_BOOTSTRAP_ADMIN_PASSWORD: ${AEGIS_BOOTSTRAP_ADMIN_PASSWORD:-admin123456789} # pragma: allowlist secret
    volumes:
      # Read-only view of the checkpoint folder, for the eval@2 report only.
      - ../data/checkpoints/flownet:/models/flownet:ro
    ports:
      - '8000:8000'
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      ml-service:
        condition: service_healthy
      # Soft: the backend runs without Redis, with a per-process login limit.
      redis:
        condition: service_started
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz', timeout=3).status==200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  dashboard:
    mem_limit: 128m
    build:
      context: ../dashboard
    ports:
      - '8080:8080'
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:8080/ >/dev/null || exit 1']
      interval: 10s
      timeout: 5s
      retries: 6

  # Network capture service — captures REAL traffic from the host network.
  # Requires: --cap-add=NET_ADMIN or --privileged
  # Override interface with a Linux interface name, e.g.:
  #   AEGIS_CAPTURE_INTERFACE=wlan0 docker compose up
  # Windows/macOS adapter names (Wi-Fi, Ethernet) do not exist in the container.
  # On Docker Desktop, network_mode: host is the Linux VM's network, not the host
  # adapter, so little real traffic is seen. See
  # backend/app/services/capture/bridges/README.md ("Docker Desktop").
  # Default interface per service differs; see the same README for the table.
  # Network capture: one container, one image (replaces capture, zeek, suricata and
  # tshark). Engines run side by side, chosen by AEGIS_CAPTURE_ENGINES. zeek supplies
  # flows and suricata supplies alerts and protocol logs. tshark is opt-in: it
  # aggregates the same connections as zeek, so enabling it counts flows twice.
  capture:
    # Zeek plus Suricata with the full ET Open rule set (~69k rules) used 964 MiB and was
    # OOM-killed at the old 1g limit. Raise it if the container shows OOMKilled=true again.
    mem_limit: 2g
    build:
      context: ../backend
      dockerfile: app/services/capture/Dockerfile.capture
    environment:
      AEGIS_API_URL: http://localhost:8000
      AEGIS_EMAIL: ${AEGIS_BOOTSTRAP_ADMIN_EMAIL:-admin@aegis.local}
      # No default: the capture service refuses to start without a non-default password.
      AEGIS_PASSWORD: ${AEGIS_BOOTSTRAP_ADMIN_PASSWORD:-}
      AEGIS_CAPTURE_ENGINES: ${AEGIS_CAPTURE_ENGINES:-zeek,suricata}
      # AEGIS_CAPTURE_INTERFACE is still honoured as the fallback for every engine.
      AEGIS_ZEEK_INTERFACE: ${AEGIS_ZEEK_INTERFACE:-${AEGIS_CAPTURE_INTERFACE:-eth0}}
      AEGIS_SURICATA_INTERFACE: ${AEGIS_SURICATA_INTERFACE:-${AEGIS_CAPTURE_INTERFACE:-eth0}}
      AEGIS_TSHARK_INTERFACE: ${AEGIS_TSHARK_INTERFACE:-${AEGIS_CAPTURE_INTERFACE:-any}}
      # Records the API refused to take during an outage wait here, on a named volume, so a
      # container restart does not lose them. Capped by AEGIS_SPOOL_MAX_MB in the shipper.
      AEGIS_SPOOL_DIR: /var/lib/aegis-spool
      AEGIS_SPOOL_MAX_MB: ${AEGIS_SPOOL_MAX_MB:-64}
    volumes:
      - capture-spool:/var/lib/aegis-spool
    network_mode: host
    depends_on:
      backend:
        condition: service_healthy
    cap_add:
      - NET_ADMIN
    restart: unless-stopped

volumes:
  postgres-data:
  kafka-kraft-data:
  capture-spool:
