# Lint configuration for repository-level scripts.
# backend/ and ml-service/ carry their own pyproject.toml configurations.
line-length = 100
target-version = "py311"

[lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "D", "S", "BLE", "ASYNC", "EXE"]
ignore = ["D203", "D213"]

[lint.pydocstyle]
convention = "google"

# Every script in this directory inserts ml-service/ into sys.path before
# importing aegis_ml, because the packages are not installed for a bare
# `python scripts/x.py`. That makes E402 unavoidable by construction, and
# suppressing it per-import is fragile: black re-wraps a long import onto
# several lines and moves the trailing `# noqa` to the closing parenthesis,
# where it suppresses nothing. It has broken the docs job three times this way,
# so the rule is off for the directory instead of per line.
[lint.per-file-ignores]
"scripts/*.py" = ["E402"]
