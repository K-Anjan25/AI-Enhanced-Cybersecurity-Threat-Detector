{{- if .Values.scoringWorker.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "aegis.fullname" . }}-scoring-worker
  labels:
    {{- include "aegis.labels" . | nindent 4 }}
    app.kubernetes.io/component: scoring-worker
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "aegis.fullname" . }}-scoring-worker
  minReplicas: {{ .Values.scoringWorker.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.scoringWorker.autoscaling.maxReplicas }}
  metrics:
    - type: Pods
      pods:
        metric:
          name: aegis_consumer_lag
        target:
          type: AverageValue
          averageValue: {{ .Values.scoringWorker.autoscaling.targetConsumerLag }}
{{- end }}
