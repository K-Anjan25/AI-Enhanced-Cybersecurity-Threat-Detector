{{/*
Login-throttle counters (app/services/login_throttle.py). Sized for counters only:
no persistence, a memory ceiling, and an eviction policy that drops expiring keys
first. A restart forgets the open windows, which only lets an attacker retry sooner
once; it never corrupts an account. Reachable from backend pods only (NetworkPolicy
below), because anything that can reach it can clear the counters.
*/}}
{{- if .Values.redis.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aegis.fullname" . }}-redis
  labels:
    {{- include "aegis.redis.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "aegis.redis.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "aegis.redis.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
      containers:
        - name: redis
          image: "{{ .Values.global.imageRegistry }}{{ .Values.redis.image.repository }}:{{ .Values.redis.image.tag }}"
          imagePullPolicy: {{ .Values.redis.image.pullPolicy }}
          command:
            - redis-server
            - --maxmemory
            - {{ printf "%dmb" (int .Values.redis.maxmemoryMb) | quote }}
            - --maxmemory-policy
            - volatile-ttl
            - --save
            - ""
            - --appendonly
            - "no"
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "aegis.fullname" . }}-redis
  labels:
    {{- include "aegis.redis.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "aegis.redis.selectorLabels" . | nindent 4 }}
  ports:
    - name: redis
      port: 6379
      targetPort: redis
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "aegis.fullname" . }}-redis
  labels:
    {{- include "aegis.redis.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "aegis.redis.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "aegis.backend.selectorLabels" . | nindent 14 }}
      ports:
        - port: 6379
          protocol: TCP
{{- end }}
