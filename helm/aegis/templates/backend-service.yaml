apiVersion: v1
kind: Service
metadata:
  name: {{ include "aegis.fullname" . }}-backend
  labels:
    {{- include "aegis.backend.labels" . | nindent 4 }}
spec:
  type: {{ .Values.backend.service.type }}
  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "aegis.backend.selectorLabels" . | nindent 4 }}
---
{{- /*
The dashboard's nginx proxies to the fixed hostname `backend` (see
dashboard/nginx.conf.template and k8s/30-backend.yaml). This alias gives that
name to the backend pods when the release is not itself named `backend`.
*/ -}}
{{- if ne (include "aegis.fullname" .) "backend" }}
apiVersion: v1
kind: Service
metadata:
  name: backend
  labels:
    {{- include "aegis.backend.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "aegis.backend.selectorLabels" . | nindent 4 }}
{{- end }}
