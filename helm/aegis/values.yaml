# AEGIS Helm values — defaults (development/staging).

global:
  imageRegistry: ""
  imagePullSecrets: []

# ──────────────────────────────────────────────
# Backend
# ──────────────────────────────────────────────
backend:
  replicaCount: 1
  image:
    repository: aegis-backend
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8000
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  env:
    AEGIS_ENV: production
    AEGIS_PORT: "8000"
    AEGIS_HOST: "0.0.0.0"
    AEGIS_LOG_LEVEL: INFO
  secretEnv:
    - AEGIS_SECRET_KEY
    - AEGIS_DATABASE_URL
  probes:
    liveness:
      path: /healthz
      initialDelaySeconds: 15
      periodSeconds: 10
    readiness:
      path: /healthz
      initialDelaySeconds: 10
      periodSeconds: 5

# ──────────────────────────────────────────────
# ML Service
# ──────────────────────────────────────────────
mlService:
  replicaCount: 1
  image:
    repository: aegis-ml-service
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8001
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 2Gi
  env:
    AEGIS_ENV: production
    AEGIS_LOG_LEVEL: INFO
  probes:
    liveness:
      path: /health
      initialDelaySeconds: 20
      periodSeconds: 10

# ──────────────────────────────────────────────
# Scoring Workers (T-307)
# ──────────────────────────────────────────────
scoringWorker:
  replicaCount: 2
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetConsumerLag: 1000  # Scale up when Kafka lag exceeds this
  image:
    repository: aegis-backend
    tag: "0.1.0"
    command: ["python", "-m", "app.workers.scoring"]
  resources:
    requests:
      cpu: 250m
      memory: 512Mi

# ──────────────────────────────────────────────
# Dashboard
# ──────────────────────────────────────────────
dashboard:
  replicaCount: 1
  image:
    repository: aegis-dashboard
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8080
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

# ──────────────────────────────────────────────
# PostgreSQL (optional — use external managed DB in production)
# ──────────────────────────────────────────────
postgresql:
  enabled: false
  auth:
    database: aegis
    username: aegis
  primary:
    persistence:
      size: 20Gi

# ──────────────────────────────────────────────
# Kafka (optional — use external managed Kafka in production)
# ──────────────────────────────────────────────
kafka:
  enabled: false
  persistence:
    size: 20Gi

# ──────────────────────────────────────────────
# Secrets (created externally from cluster secret store)
# ──────────────────────────────────────────────
secrets:
  # aegis-secrets must contain:
  #   AEGIS_SECRET_KEY (32+ random chars)
  #   AEGIS_DATABASE_URL (postgresql+psycopg://...)
  #   AEGIS_BOOTSTRAP_ADMIN_EMAIL
  #   AEGIS_BOOTSTRAP_ADMIN_PASSWORD
  existingSecret: aegis-secrets

# ──────────────────────────────────────────────
# Ingress
# ──────────────────────────────────────────────
ingress:
  enabled: false
  className: nginx
  annotations: {}
  hosts:
    - host: aegis.example.com
      paths:
        - path: /
          pathType: Prefix
          service: dashboard
        - path: /api
          pathType: Prefix
          service: backend
  tls: []
