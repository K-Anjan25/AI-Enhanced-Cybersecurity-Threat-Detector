apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  namespace: threat-ai
  labels:
    app: dashboard
    component: ui
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dashboard
  template:
    metadata:
      labels:
        app: dashboard
    spec:
      containers:
        - name: dashboard
          image: threat-ai/dashboard:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard
  namespace: threat-ai
spec:
  selector:
    app: dashboard
  ports:
    - port: 3000
      targetPort: 3000