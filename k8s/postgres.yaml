# In-cluster PostgreSQL for the demo deployment. For production, prefer a
# managed DB; the backend runs additive migrations on startup regardless.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: threat-ai
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: threatdb
            - name: POSTGRES_USER
              value: threatuser
            - name: POSTGRES_PASSWORD
              value: threatpass
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "threatuser"]
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: threat-ai
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: threat-ai
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
