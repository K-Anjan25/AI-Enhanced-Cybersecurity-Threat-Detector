# CPU and memory only. architecture.md 11.2 also calls for scaling on request
# latency, Kafka consumer lag and inference queue depth; those need a
# custom-metrics adapter and land with the workloads that produce the metrics.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend
  namespace: aegis
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
