# Static dashboard with SPA fallback and an API proxy.
# The browser only ever talks to this origin; /api and /ws are proxied to the
# backend so no cross-origin request is needed.
#
# Port 8080, not 80: binding below 1024 needs CAP_NET_BIND_SERVICE, which would
# mean running the container as root. The unprivileged nginx image listens here.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
    }

    location /ws/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
