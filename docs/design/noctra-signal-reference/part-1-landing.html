        :root {

        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;

        body {
            margin: 0;
            width: 100%;
            font-family: "DM Sans", sans-serif;
            color: #e8f0ed;
            overflow-x: hidden;
        }

        .noctra-shell {
            width: 100%;
            min-height: calc(100 * min(var(--vh, 1vh), 1vh));
            position: relative;
            isolation: isolate;
            background-color: var(--ink);
            background-image:
                radial-gradient(circle at 76% 13%, rgba(81, 190, 100, .18), transparent 28rem),
                radial-gradient(circle at 12% 64%, rgba(12, 79, 83, .18), transparent 25rem);
        }

        .noctra-shell::before {
            content: "";
            position: fixed;
            z-index: -1;
            inset: 0;
            pointer-events: none;
            opacity: .21;
            background-image:
                linear-gradient(rgba(169, 255, 93, .11) 1px, transparent 1px),
                linear-gradient(90deg, rgba(169, 255, 93, .11) 1px, transparent 1px);
            background-size: 56px 56px;
            mask-image: linear-gradient(to bottom, black, transparent 86%);
        }

        .tech-label {
            font-family: "Space Mono", monospace;
            font-size: .68rem;
            letter-spacing: .13em;
            text-transform: uppercase;
        }

        .nav-link {
            color: #aebdc0;
            font-size: .88rem;
            transition: color .2s ease;
        }

        .nav-link:hover {
            color: var(--signal);
        }

        .signal-dot {
            width: 8px;
            height: 8px;
            border-radius: 999px;
            background: var(--signal);
            box-shadow: 0 0 0 5px rgba(166, 255, 63, .11), 0 0 16px rgba(166, 255, 63, .9);
            animation: pulse 2s infinite;
        }

        .hero-line {
            width: 88px;
            height: 1px;
            background: linear-gradient(90deg, var(--signal), transparent);
        }

        .hero-image-wrap {
            position: relative;
            min-height: 320px;
            overflow: hidden;
            border: 1px solid rgba(166, 255, 63, .24);
            border-radius: 2px;
            box-shadow: 0 24px 70px rgba(0, 0, 0, .35);
        }

        .hero-image-wrap::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(4, 12, 12, .14), rgba(4, 12, 12, .82));
            pointer-events: none;
        }

        .corner {
            position: absolute;
            width: 18px;
            height: 18px;
            z-index: 2;
        }

        .corner-tl {
            top: -1px;
            left: -1px;
            border-top: 2px solid var(--signal);
            border-left: 2px solid var(--signal);
        }

        .corner-br {
            right: -1px;
            bottom: -1px;
            border-right: 2px solid var(--signal);
            border-bottom: 2px solid var(--signal);
        }

        .console-panel {
            background: linear-gradient(145deg, rgba(17, 28, 35, .97), rgba(8, 14, 18, .98));
            border: 1px solid var(--line);
            box-shadow: 0 26px 80px rgba(0, 0, 0, .3);
        }

        .metric-card {
            background: rgba(3, 8, 10, .55);
            border: 1px solid rgba(162, 193, 198, .12);
        }

        .threat-item {
            border-left: 2px solid var(--signal);
            background: rgba(166, 255, 63, .045);
        }

        .feature-card {
            border-top: 1px solid rgba(166, 255, 63, .55);
            background: rgba(13, 21, 27, .72);
            transition: transform .25s ease, background .25s ease;
        }

        .feature-card:hover {
            transform: translateY(-5px);
            background: rgba(20, 33, 39, .94);
        }

        .scan-ring {
            width: 68px;
            height: 68px;
            border: 1px solid rgba(166, 255, 63, .3);
            border-radius: 999px;
            position: relative;
            display: grid;
            place-items: center;
        }

        .scan-ring::before {
            content: "";
            position: absolute;
            inset: 7px;
            border-radius: inherit;
            border: 1px dashed rgba(166, 255, 63, .48);
        }

        .is-scanning .scan-ring::before {
            animation: spin 1.8s linear infinite;
        }

        .scan-core {
            width: 10px;
            height: 10px;
            border-radius: 999px;
            background: #829398;
        }

        .is-scanning .scan-core {
            background: var(--signal);
            box-shadow: 0 0 16px var(--signal);
            animation: pulse 1s infinite;
        }

        .scan-line {
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--signal), transparent);
            opacity: 0;
            transform: translateX(-100%);
        }

        .is-scanning .scan-line {
            opacity: 1;
            animation: sweep 2.2s ease-in-out infinite;
        }

        .action-button {
            background: #a6ff3f;
            color: #071006;
            font-weight: 700;
            transition: transform .2s ease, box-shadow .2s ease;
        }

        .action-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(166, 255, 63, .2);
        }

        .secondary-button {
            border: 1px solid rgba(190, 216, 218, .28);
            color: #d9e5e1;
            transition: border-color .2s ease, color .2s ease;
        }

        .secondary-button:hover {
            border-color: var(--signal);
            color: var(--signal);
        }

        .reveal {
            animation: reveal .7s both;
        }

        .delay-1 {
            animation-delay: .12s;
        }

        .delay-2 {
            animation-delay: .22s;
        }

        .delay-3 {
            animation-delay: .32s;
        }

        :focus-visible {
            outline: 2px solid var(--signal);
            outline-offset: 4px;
        }

        @keyframes pulse {
            50% {
                opacity: .45;
                transform: scale(.82);
            }
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes sweep {
            50% {
                transform: translateX(100%);
            }

            100% {
                transform: translateX(100%);
            }
        }

        @keyframes reveal {
            from {
                opacity: 0;
                transform: translateY(18px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 767px) {
            .hero-image-wrap {
                min-height: 240px;
            }
        }
    </style>

                        class="canva-button action-button relative mt-8 rounded-sm px-5 py-3.5 text-sm" type="button"
                        data-scroll-target="top"></button>
                </div>
            </section>
        </main>
        <footer class="border-t border-white/10">
            <div
                class="mx-auto flex max-w-7xl flex-col justify-between gap-4 px-5 py-7 text-sm text-[#71858a] sm:flex-row lg:px-8">
                <p data-template-id="footer-copy" class="canva-text"></p>
                <p data-template-id="footer-status" class="canva-text tech-label text-[#a6ff3f]"></p>
            </div>
        </footer>
    </div>
    <script src="/_sdk/32b5df5c9e791b84.editing_sdk.js"
        integrity="sha512-GR6onBO6a4OXCEWjJr3J5SnC5JY67X7RCAiMRpOa2PonluOQlBKrbHUWMck4+e73st/dspPngOjAjH//UV4K2Q=="></script>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            lucide.createIcons();

            document.querySelectorAll("[data-scroll-target]").forEach(function (button) {
                button.addEventListener("click", function () {
                    const target = document.getElementById(button.dataset.scrollTarget);
                    if (target) target.scrollIntoView({ behavior: "smooth", block: "start" });
                });
            });

            const dashboard = document.getElementById("dashboard-demo");
            const startButton = dashboard.querySelector(".scan-start");
            const resetButton = dashboard.querySelector(".scan-reset");
            const readyCopy = dashboard.querySelector(".scan-ready");
            const activeCopy = dashboard.querySelector(".scan-active");

            startButton.addEventListener("click", function () {
                dashboard.classList.add("is-scanning");
                startButton.classList.add("hidden");
                resetButton.classList.remove("hidden");
                readyCopy.classList.add("hidden");
                activeCopy.classList.remove("hidden");
            });

            resetButton.addEventListener("click", function () {
                dashboard.classList.remove("is-scanning");
                resetButton.classList.add("hidden");
                startButton.classList.remove("hidden");
                activeCopy.classList.add("hidden");
                readyCopy.classList.remove("hidden");
            });
        });
    </script>
</body>

</html>
