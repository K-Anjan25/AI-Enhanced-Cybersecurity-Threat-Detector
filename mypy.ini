# mypy configuration for repository-level scripts.
# backend/ and ml-service/ carry their own [tool.mypy] in pyproject.toml and are
# unaffected by this file.
[mypy]
python_version = 3.11
strict = True
warn_unreachable = True
# scripts/check_compose.py imports the applications after manipulating sys.path
# at runtime; mypy_path lets it resolve them statically instead of ignoring them.
mypy_path = backend:ml-service
# Must match backend/pyproject.toml, otherwise mypy type-checks the Pydantic
# models it follows into backend/ without Pydantic semantics.
plugins = pydantic.mypy

# ``app.workers.scoring_worker`` imports ``aegis_ml`` at module level, and the
# backend image does not install it, so those two imports carry
# ``# type: ignore[import-not-found]``: correct for the image the worker runs in.
# This config puts ml-service on ``mypy_path`` (check_compose.py imports the
# applications after manipulating sys.path), so *here* the imports resolve and the
# ignores look unused -- and the answer depended on whether backend/.mypy_cache had
# been warmed by the backend's own strict run first, so the two check orders
# disagreed. T-416 is what first pulled the worker into this config's import graph.
# The module is still checked in full; only the unused-ignore diagnostic is off.
[mypy-app.workers.scoring_worker]
warn_unused_ignores = False

# torch, the ONNX stack and numpy ship without usable stubs, and they are optional
# extras of ml-service: when absent they surface as import-not-found. This config
# type-checks ml-service's modules too (the scripts import them), so it needs the
# same silencing ml-service/pyproject.toml declares for its own run.
[mypy-torch.*]
ignore_missing_imports = True

[mypy-onnx.*]
ignore_missing_imports = True

[mypy-onnxruntime.*]
ignore_missing_imports = True

[mypy-onnxscript.*]
ignore_missing_imports = True

[mypy-numpy.*]
ignore_missing_imports = True

# strict enables disallow_subclassing_any, which rejects `class FlowNet(nn.Module)`
# whenever torch is absent. The same exemption ml-service declares for these modules.
[mypy-aegis_ml.models.*]
disallow_subclassing_any = False

[mypy-aegis_ml.serving.*]
disallow_subclassing_any = False
