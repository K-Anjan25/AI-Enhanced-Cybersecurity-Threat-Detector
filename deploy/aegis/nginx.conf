# nginx for the combined AEGIS container (deploy/aegis). start.sh replaces __PORT__.
# Runs as an unprivileged user, so every writable path is under /tmp/aegis-run.
worker_processes 1;
pid /tmp/aegis-run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;

    client_body_temp_path /tmp/aegis-run/client;
    proxy_temp_path /tmp/aegis-run/proxy;

    # Upgrade only when the client asks for a WebSocket.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen __PORT__;
        server_name _;

        root /opt/aegis/dashboard;
        index index.html;

        # WebSocket for live alerts. Must come before the generic /api/ location.
        location /api/v1/alerts/ws {
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location /api/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_read_timeout 30s;
        }

        location = /metrics {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
        }

        location = /healthz {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
        }

        # Everything else is the dashboard. Unknown paths fall back to the app shell.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
