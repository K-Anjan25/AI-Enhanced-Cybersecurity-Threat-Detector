<!DOCTYPE html>
<!--
  AEGIS marketing site — single-file build.

  Everything the site needs lives in this one HTML file:
    • React 18 + ReactDOM (UMD) and Babel Standalone compile the JSX in the browser.
    • Styling uses one <style> block with CSS custom properties and BEM-style class
      names prefixed `aeg-`. Each component's styles sit together in that block.
    • Icons: Font Awesome Free 6 (CDN). Fonts: Google Fonts (Orbitron, Inter, JetBrains Mono).
    • Placeholder imagery: placehold.co.

  Pages (hash routing, so the file works from any static host or from disk):
    #/            Home
    #/features    Features
    #/pricing     Pricing and FAQ
    #/contact     Contact, offices and map

  Before going live, replace the items marked TODO: the newsletter and contact
  endpoints, the canonical/OG URL, the social profile links, the legal pages,
  and the plan prices. Figures on this page come from the product's own limits
  and defaults and should be re-checked against the release you ship.
-->
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Primary SEO tags -->
  <title>AEGIS | AI-Enhanced Threat Detection for Security Teams</title>
  <meta name="description" content="AEGIS scores network flows and system logs with machine-learning models, then turns anomalies into prioritised alerts your analysts can triage in minutes. Self-hosted, auditable and role-based." />
  <meta name="keywords" content="threat detection, network anomaly detection, SOC automation, security analytics, machine learning security, alert triage, SIEM alternative, self-hosted SIEM" />
  <meta name="author" content="AEGIS" />
  <meta name="robots" content="index, follow, max-image-preview:large" />
  <meta name="theme-color" content="#05070d" />
  <link rel="canonical" href="https://www.example.com/" />
  <!-- TODO: replace https://www.example.com with the production origin. -->

  <!-- Open Graph / social sharing -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="AEGIS" />
  <meta property="og:title" content="AEGIS | AI-Enhanced Threat Detection" />

  <meta property="og:url" content="https://www.example.com/" />
  <meta property="og:image" content="https://placehold.co/1200x630/05070d/22e5ff?text=AEGIS" />
  <meta property="og:image:alt" content="AEGIS threat detection dashboard" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="AEGIS | AI-Enhanced Threat Detection" />

  <meta name="twitter:image" content="https://placehold.co/1200x630/05070d/22e5ff?text=AEGIS" />

  <script type="application/ld+json">

  <!-- Favicon as inline SVG (no extra request) -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2305070d'/%3E%3Cpath d='M32 10 50 17v14c0 11-8 19-18 23C22 50 14 42 14 31V17z' fill='none' stroke='%2322e5ff' stroke-width='4'/%3E%3C/svg%3E" />

  <!-- Performance: connect to third-party hosts early -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://placehold.co" crossorigin />

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet" />

  <!-- Font Awesome Free (icons) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.2/css/all.min.css" crossorigin="anonymous" />

  <!-- ==================================================================
       STYLES — design tokens first, then base, then components.
       ================================================================== -->
  <style>
    /* ---------- 1. Design tokens (CSS custom properties) ---------- */
    :root {
      /* Surfaces */
      --bg: #05070d;
      --bg-2: #0a0f1c;
      --surface: #0f1729;
      --surface-2: #151f36;
      --line: rgba(120, 190, 255, 0.16);
      --line-strong: rgba(120, 190, 255, 0.35);

      /* Text: all pairs above 4.5:1 on --bg and --surface */
      --text: #e8f0fb;
      --muted: #b4c2d6;

      /* Neon accents */
      --cyan: #22e5ff;
      --magenta: #ff3ec8;
      --lime: #b6ff3b;
      --amber: #ffb020;
      --danger: #ff6b81;

      /* Shape, rhythm, motion */
      --radius: 14px;
      --radius-sm: 8px;
      --container: 1180px;
      --gutter: clamp(16px, 4vw, 40px);
      --section-space: clamp(64px, 9vw, 120px);
      --glow-cyan: 0 0 24px rgba(34, 229, 255, 0.28);
      --glow-magenta: 0 0 24px rgba(255, 62, 200, 0.28);
      --ease-out: cubic-bezier(0.2, 0.7, 0.2, 1);
      --header-h: 68px;

      /* Type */
      --font-display: "Orbitron", "Inter", system-ui, sans-serif;
      --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    /* ---------- 2. Base ---------- */
    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
    /* Leave room for the fixed header when jumping to an anchor. */
    [id] { scroll-margin-top: calc(var(--header-h) + 16px); }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(1200px 600px at 10% -10%, rgba(255, 62, 200, 0.08), transparent 60%),
        radial-gradient(1000px 700px at 110% 10%, rgba(34, 229, 255, 0.08), transparent 60%),
        var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      font-size: 1rem;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    img { max-width: 100%; height: auto; display: block; }
    a { color: var(--cyan); text-decoration-thickness: 1px; text-underline-offset: 3px; }
    a:hover { color: #9ff6ff; }
    h1, h2, h3, h4 { line-height: 1.15; margin: 0 0 0.5em; font-weight: 700; }
    h1 { font-family: var(--font-display); font-size: clamp(2rem, 5.2vw, 3.6rem); letter-spacing: 0.02em; }
    h2 { font-family: var(--font-display); font-size: clamp(1.6rem, 3.6vw, 2.5rem); letter-spacing: 0.01em; }
    h3 { font-size: clamp(1.125rem, 2vw, 1.35rem); }
    p { margin: 0 0 1em; color: var(--muted); }
    ul { margin: 0; padding: 0; }
    code, .aeg-mono { font-family: var(--font-mono); font-size: 0.92em; }

    /* Keyboard focus is always visible (WCAG 2.4.7). */
    :focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; border-radius: 4px; }

    /* Screen-reader-only text and the skip link */
    .aeg-sr-only {
      position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
    }
    .aeg-skip {
      position: fixed; top: 8px; left: 8px; z-index: 1000; padding: 10px 16px;
      background: var(--cyan); color: #05070d; font-weight: 700; border-radius: var(--radius-sm);
      transform: translateY(-200%); transition: transform 0.2s var(--ease-out);
    }
    .aeg-skip:focus { transform: translateY(0); }

    .aeg-container { width: min(100% - 2 * var(--gutter), var(--container)); margin-inline: auto; }
    .aeg-section { padding-block: var(--section-space); position: relative; }
    .aeg-section--alt { background: linear-gradient(180deg, transparent, rgba(15, 23, 41, 0.6), transparent); }
    .aeg-eyebrow {
      display: inline-block; font-family: var(--font-mono); font-size: 0.8rem; font-weight: 600;
      letter-spacing: 0.14em; text-transform: uppercase; color: var(--magenta); margin-bottom: 14px;
    }
    .aeg-lead { font-size: clamp(1.05rem, 1.6vw, 1.2rem); max-width: 60ch; }
    .aeg-neon-text { color: var(--cyan); text-shadow: 0 0 18px rgba(34, 229, 255, 0.45); }

    /* ---------- 3. Buttons ---------- */
    .aeg-btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 10px;
      min-height: 46px; padding: 12px 22px; border-radius: 999px;
      border: 1px solid var(--cyan); background: transparent; color: var(--cyan);
      font: 600 0.95rem/1 var(--font-body); letter-spacing: 0.02em; text-decoration: none;
      cursor: pointer; transition: background 0.2s, color 0.2s, box-shadow 0.2s, transform 0.2s var(--ease-out);
    }
    .aeg-btn:hover { background: rgba(34, 229, 255, 0.12); color: #c8fbff; box-shadow: var(--glow-cyan); transform: translateY(-1px); }
    .aeg-btn--solid { background: var(--cyan); color: #05070d; }
    .aeg-btn--solid:hover { background: #7ff3ff; color: #05070d; }
    .aeg-btn--magenta { border-color: var(--magenta); color: var(--magenta); }
    .aeg-btn--magenta:hover { background: rgba(255, 62, 200, 0.12); color: #ffd1f1; box-shadow: var(--glow-magenta); }
    .aeg-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; box-shadow: none; }
    .aeg-btn-row { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 28px; }

    /* ---------- 4. Header, hamburger and overlay menu ---------- */
    .aeg-header {
      position: fixed; inset: 0 0 auto 0; height: var(--header-h); z-index: 100;
      display: flex; align-items: center; background: rgba(5, 7, 13, 0.78);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--line);
    }
    .aeg-header__inner { display: flex; align-items: center; justify-content: space-between; width: 100%; }
    .aeg-brand { display: inline-flex; align-items: center; gap: 10px; color: var(--text); text-decoration: none; font-family: var(--font-display); font-weight: 900; letter-spacing: 0.12em; }
    .aeg-brand:hover { color: var(--text); }
    .aeg-brand__mark {
      display: grid; place-items: center; width: 36px; height: 36px; border-radius: 10px;
      border: 1px solid var(--cyan); color: var(--cyan); box-shadow: var(--glow-cyan);
    }
    .aeg-header__cta { display: none; }
    .aeg-hamburger {
      display: inline-flex; flex-direction: column; justify-content: center; gap: 6px;
      width: 48px; height: 48px; padding: 12px; background: transparent; cursor: pointer;
      border: 1px solid var(--line-strong); border-radius: var(--radius-sm);
    }
    .aeg-hamburger span {
      display: block; height: 2px; width: 100%; background: var(--cyan); border-radius: 2px;
      transition: transform 0.3s var(--ease-out), opacity 0.2s;
    }
    .aeg-hamburger[aria-expanded="true"] span:nth-child(1) { transform: translateY(8px) rotate(45deg); }
    .aeg-hamburger[aria-expanded="true"] span:nth-child(2) { opacity: 0; }
    .aeg-hamburger[aria-expanded="true"] span:nth-child(3) { transform: translateY(-8px) rotate(-45deg); }

    /* Full-screen menu. Hidden nav: this is the only way to reach pages on every viewport. */
    .aeg-menu {
      position: fixed; inset: 0; z-index: 90; display: flex; flex-direction: column; justify-content: center;
      padding: calc(var(--header-h) + 24px) var(--gutter) 40px;
      background: rgba(5, 7, 13, 0.97); backdrop-filter: blur(14px);
      opacity: 0; visibility: hidden; transition: opacity 0.3s var(--ease-out), visibility 0.3s;
    }
    .aeg-menu.is-open { opacity: 1; visibility: visible; }
    .aeg-menu__list { list-style: none; display: grid; gap: 6px; max-width: 520px; margin-inline: auto; width: 100%; }
    .aeg-menu__link {
      display: flex; align-items: baseline; gap: 16px; padding: 14px 16px; border-radius: var(--radius-sm);
      color: var(--text); text-decoration: none; font-family: var(--font-display); font-size: clamp(1.25rem, 4vw, 1.75rem);
      border: 1px solid transparent; transition: background 0.2s, border-color 0.2s;
    }
    .aeg-menu__link:hover, .aeg-menu__link[aria-current="page"] { background: rgba(34, 229, 255, 0.08); border-color: var(--line-strong); color: var(--cyan); }
    .aeg-menu__index { font-family: var(--font-mono); font-size: 0.8rem; color: var(--magenta); }
    .aeg-menu__foot { margin-top: 32px; max-width: 520px; margin-inline: auto; width: 100%; }

    /* ---------- 5. Sticky CTA ---------- */
    .aeg-sticky-cta {
      position: fixed; right: 16px; bottom: 16px; z-index: 80;
      opacity: 0; transform: translateY(20px); pointer-events: none;
      transition: opacity 0.3s var(--ease-out), transform 0.3s var(--ease-out);
      box-shadow: var(--glow-cyan);
    }
    .aeg-sticky-cta.is-visible { opacity: 1; transform: none; pointer-events: auto; }

    /* ---------- 6. Hero (canvas + parallax) ---------- */
    .aeg-hero {
      position: relative; min-height: min(100vh, 900px); display: flex; align-items: center;
      padding-top: calc(var(--header-h) + 40px); padding-bottom: 80px; overflow: hidden; isolation: isolate;
    }
    .aeg-hero__canvas { position: absolute; inset: 0; width: 100%; height: 100%; z-index: -2; }
    /* Parallax layers: JavaScript moves each [data-depth] element by scrollY × depth. */
    .aeg-hero__layer { position: absolute; pointer-events: none; will-change: transform; }
    .aeg-hero__grid {
      inset: -20% -10%; z-index: -3; opacity: 0.35;
      background-image:
        linear-gradient(rgba(34, 229, 255, 0.12) 1px, transparent 1px),
        linear-gradient(90deg, rgba(34, 229, 255, 0.12) 1px, transparent 1px);
      background-size: 64px 64px;
      transform-origin: center top; mask-image: radial-gradient(ellipse at center, #000 30%, transparent 75%);
    }
    .aeg-hero__orb { width: min(46vw, 520px); aspect-ratio: 1; border-radius: 50%; filter: blur(60px); z-index: -2; }
    .aeg-hero__orb--a { background: rgba(255, 62, 200, 0.35); top: 8%; right: -6%; }
    .aeg-hero__orb--b { background: rgba(34, 229, 255, 0.3); bottom: -10%; left: -8%; }
    .aeg-hero__grid-wrap { display: grid; grid-template-columns: 1.1fr 0.9fr; gap: clamp(32px, 5vw, 64px); align-items: center; }
    .aeg-hero__copy { position: relative; z-index: 1; }
    .aeg-hero__copy h1 { text-shadow: 0 0 22px rgba(34, 229, 255, 0.25); }
    .aeg-hero__visual { position: relative; min-height: 380px; }

    /* Sample alert card used as a hero visual; its data is illustrative. */
    .aeg-card {
      background: rgba(15, 23, 41, 0.86); border: 1px solid var(--line-strong); border-radius: var(--radius);
      box-shadow: var(--glow-cyan), inset 0 1px 0 rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(6px);
    }
    .aeg-alert-card { position: relative; z-index: 1; padding: 22px; max-width: 460px; margin-left: auto; }
    .aeg-alert-card__head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; font-family: var(--font-mono); font-size: 0.8rem; color: var(--muted); }
    .aeg-alert-row { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); }
    .aeg-alert-row__title { color: var(--text); font-weight: 600; font-size: 0.95rem; }
    .aeg-alert-row__meta { font-family: var(--font-mono); font-size: 0.75rem; color: var(--muted); }
    .aeg-pill { font-family: var(--font-mono); font-size: 0.72rem; font-weight: 600; padding: 4px 10px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }
    .aeg-pill--high { color: var(--magenta); }
    .aeg-pill--med { color: var(--amber); }
    .aeg-pill--low { color: var(--lime); }
    .aeg-score { position: relative; z-index: 2; margin: 0 0 0 auto; width: 210px; padding: 16px; margin-top: -40px; margin-right: 10px; }
    .aeg-score__value { font-family: var(--font-display); font-size: 2.2rem; color: var(--lime); text-shadow: 0 0 16px rgba(182, 255, 59, 0.4); }
    .aeg-score__bar { height: 6px; border-radius: 6px; background: var(--surface-2); overflow: hidden; margin-top: 10px; }
    .aeg-score__bar span { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--cyan), var(--lime)); transition: width 1.4s var(--ease-out) 0.4s; }
    .aeg-hero.is-ready .aeg-score__bar span { width: 87%; }
    .aeg-hero__scroll { position: absolute; bottom: 22px; left: 50%; transform: translateX(-50%); color: var(--muted); font-size: 0.8rem; text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .aeg-hero__scroll:hover { color: var(--cyan); }
    .aeg-hero__scroll i { animation: aeg-bob 1.8s ease-in-out infinite; }
    @keyframes aeg-bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(6px); } }

    /* ---------- 7. Trust strip ---------- */
    .aeg-trust { border-block: 1px solid var(--line); background: rgba(10, 15, 28, 0.7); }
    .aeg-trust__list { list-style: none; display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; }
    .aeg-trust__item { display: flex; align-items: center; gap: 12px; padding: 22px 16px; color: var(--text); font-weight: 600; font-size: 0.95rem; }
    .aeg-trust__item + .aeg-trust__item { border-left: 1px solid var(--line); }
    .aeg-trust__item i { color: var(--cyan); font-size: 1.2rem; width: 24px; text-align: center; }

    /* ---------- 8. Alternating split sections (single column on mobile) ---------- */
    .aeg-split { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(32px, 6vw, 88px); align-items: center; }
    .aeg-split + .aeg-split { margin-top: clamp(64px, 9vw, 110px); }
    .aeg-split--reverse .aeg-split__media { order: -1; }
    .aeg-split__media { position: relative; }
    .aeg-split__img { border-radius: var(--radius); border: 1px solid var(--line-strong); box-shadow: var(--glow-cyan); width: 100%; aspect-ratio: 16 / 10; object-fit: cover; }
    .aeg-split__media::after { content: ""; position: absolute; inset: 14px -14px -14px 14px; border: 1px solid rgba(255, 62, 200, 0.45); border-radius: var(--radius); z-index: -1; }
    .aeg-checklist { list-style: none; margin: 20px 0 0; display: grid; gap: 12px; }
    .aeg-checklist li { display: grid; grid-template-columns: 22px 1fr; gap: 12px; color: var(--muted); }
    .aeg-checklist i { color: var(--lime); margin-top: 5px; }
    .aeg-checklist strong { color: var(--text); }

    /* ---------- 9. Stats (animated counters) ---------- */
    .aeg-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; }
    .aeg-stat { padding: 28px 22px; text-align: left; }
    .aeg-stat__num { font-family: var(--font-display); font-size: clamp(2.2rem, 4.5vw, 3rem); font-weight: 900; color: var(--cyan); text-shadow: 0 0 18px rgba(34, 229, 255, 0.35); line-height: 1; }
    .aeg-stat__label { margin: 12px 0 0; color: var(--muted); font-size: 0.95rem; }

    /* ---------- 10. Cards and the pipeline ---------- */
    .aeg-grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
    .aeg-card-feature { padding: 28px; height: 100%; }
    .aeg-card-feature__icon { width: 52px; height: 52px; display: grid; place-items: center; border-radius: 12px; border: 1px solid var(--magenta); color: var(--magenta); font-size: 1.3rem; margin-bottom: 18px; box-shadow: var(--glow-magenta); }
    .aeg-card-feature h3 { color: var(--text); }
    .aeg-card-feature p { margin: 0; }
    .aeg-steps { list-style: none; display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; counter-reset: step; }
    .aeg-steps li { position: relative; padding: 24px 20px; border-top: 2px solid var(--cyan); background: var(--surface); border-radius: 0 0 var(--radius) var(--radius); }
    .aeg-steps li::before { counter-increment: step; content: "0" counter(step); display: block; font-family: var(--font-mono); color: var(--magenta); font-size: 0.85rem; margin-bottom: 8px; }
    .aeg-steps h3 { font-size: 1.05rem; color: var(--text); }
    .aeg-steps p { font-size: 0.93rem; margin: 0; }

    /* ---------- 11. Pricing ---------- */
    .aeg-billing { display: inline-flex; align-items: center; gap: 14px; margin: 8px 0 40px; padding: 6px; border: 1px solid var(--line-strong); border-radius: 999px; background: var(--surface); }
    .aeg-billing__opt { min-height: 40px; padding: 8px 18px; border: 0; border-radius: 999px; background: transparent; color: var(--muted); font: 600 0.9rem var(--font-body); cursor: pointer; }
    .aeg-billing__opt[aria-pressed="true"] { background: var(--cyan); color: #05070d; }
    .aeg-billing__save { font-family: var(--font-mono); font-size: 0.72rem; color: var(--lime); padding-right: 10px; }
    .aeg-tiers { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; align-items: stretch; }
    .aeg-tier { position: relative; padding: 32px 28px; display: flex; flex-direction: column; }
    .aeg-tier--featured { border-color: var(--magenta); box-shadow: var(--glow-magenta); transform: translateY(-8px); }
    .aeg-tier__badge { position: absolute; top: -13px; left: 50%; transform: translateX(-50%); background: var(--magenta); color: #05070d; font-family: var(--font-mono); font-size: 0.75rem; font-weight: 600; padding: 4px 12px; border-radius: 999px; white-space: nowrap; }
    .aeg-tier h3 { color: var(--text); margin-bottom: 4px; }
    .aeg-tier__desc { font-size: 0.95rem; min-height: 3.2em; }
    .aeg-price { font-family: var(--font-display); font-size: 2.6rem; font-weight: 900; color: var(--text); margin: 14px 0 4px; line-height: 1; }
    .aeg-price small { font-family: var(--font-body); font-size: 0.95rem; color: var(--muted); font-weight: 500; }
    .aeg-tier__list { list-style: none; margin: 22px 0 26px; display: grid; gap: 11px; flex: 1; }
    .aeg-tier__list li { display: grid; grid-template-columns: 20px 1fr; gap: 10px; color: var(--muted); font-size: 0.95rem; }
    .aeg-tier__list i { color: var(--lime); margin-top: 4px; }
    .aeg-tier__list .is-off { color: #8593a8; }
    .aeg-tier__list .is-off i { color: #6c7a90; }
    .aeg-compare { margin-top: 64px; overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); -webkit-overflow-scrolling: touch; }
    .aeg-table { width: 100%; border-collapse: collapse; min-width: 560px; background: var(--surface); }
    .aeg-table caption { text-align: left; padding: 18px 20px; font-family: var(--font-display); color: var(--text); font-size: 1rem; }
    .aeg-table th, .aeg-table td { padding: 14px 18px; text-align: left; border-top: 1px solid var(--line); color: var(--muted); font-size: 0.95rem; }
    .aeg-table thead th { color: var(--text); border-top: 0; background: var(--surface-2); font-weight: 700; }
    .aeg-table tbody th { color: var(--text); font-weight: 600; }
    .aeg-table td.is-center, .aeg-table th.is-center { text-align: center; }
    .aeg-table .fa-check { color: var(--lime); }
    .aeg-table .fa-minus { color: #6c7a90; }

    /* ---------- 12. Accordion (FAQ) ---------- */
    .aeg-faq { max-width: 860px; margin-inline: auto; }
    .aeg-accordion { display: grid; gap: 12px; }
    .aeg-acc-item { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-sm); overflow: hidden; transition: border-color 0.2s; }
    .aeg-acc-item:has(.aeg-acc-btn[aria-expanded="true"]) { border-color: var(--line-strong); }
    .aeg-acc-h { margin: 0; }
    .aeg-acc-btn {
      width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 16px;
      padding: 18px 20px; background: transparent; border: 0; color: var(--text); text-align: left;
      font: 600 1rem/1.4 var(--font-body); cursor: pointer;
    }
    .aeg-acc-btn:hover { color: var(--cyan); }
    .aeg-acc-icon { color: var(--cyan); transition: transform 0.3s var(--ease-out); flex-shrink: 0; }
    .aeg-acc-icon.is-open { transform: rotate(180deg); }
    .aeg-acc-panel { padding: 0 20px 20px; }
    .aeg-acc-panel p { margin: 0; }

    /* ---------- 13. Forms ---------- */
    .aeg-form { display: grid; gap: 16px; }
    .aeg-form__row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .aeg-field label { display: block; font-weight: 600; color: var(--text); font-size: 0.92rem; margin-bottom: 6px; }
    .aeg-field__hint { font-size: 0.82rem; color: var(--muted); margin-top: 4px; }
    .aeg-input {
      width: 100%; min-height: 48px; padding: 12px 14px; border-radius: var(--radius-sm);
      border: 1px solid var(--line-strong); background: #0a1222; color: var(--text);
      font: 400 1rem var(--font-body);
    }
    textarea.aeg-input { min-height: 140px; resize: vertical; }
    .aeg-input::placeholder { color: #7f8ea6; }
    .aeg-input:focus { outline: 2px solid var(--cyan); outline-offset: 1px; border-color: var(--cyan); }
    .aeg-input[aria-invalid="true"] { border-color: var(--danger); }
    .aeg-error { color: var(--danger); font-size: 0.88rem; margin-top: 6px; }
    .aeg-status { font-size: 0.95rem; min-height: 1.5em; margin: 0; }
    .aeg-status--ok { color: var(--lime); }
    .aeg-status--err { color: var(--danger); }
    /* Honeypot: hidden from people and assistive tech, visible to naive bots. */
    .aeg-hp { position: absolute !important; left: -10000px; width: 1px; height: 1px; overflow: hidden; }
    .aeg-consent { display: flex; gap: 10px; align-items: flex-start; font-size: 0.9rem; color: var(--muted); }
    .aeg-consent input { margin-top: 5px; accent-color: var(--cyan); width: 18px; height: 18px; flex-shrink: 0; }

    /* Newsletter band (home) */
    .aeg-band { padding: clamp(28px, 5vw, 56px); display: grid; grid-template-columns: 1.1fr 1fr; gap: 32px; align-items: center; border-color: var(--line-strong); background: linear-gradient(120deg, rgba(255,62,200,0.08), rgba(34,229,255,0.08)), var(--surface); }
    .aeg-band h2 { font-size: clamp(1.35rem, 3vw, 2rem); }
    .aeg-inline-form { display: flex; gap: 10px; flex-wrap: wrap; }
    .aeg-inline-form .aeg-input { flex: 1 1 240px; }

    /* ---------- 14. Page hero (inner pages) ---------- */
    .aeg-page-hero { padding: calc(var(--header-h) + 64px) 0 56px; position: relative; overflow: hidden; isolation: isolate; }
    .aeg-page-hero__bg { position: absolute; inset: 0; z-index: -1; background: radial-gradient(700px 320px at 80% 0%, rgba(255,62,200,0.18), transparent 70%), radial-gradient(600px 300px at 0% 100%, rgba(34,229,255,0.16), transparent 70%); }
    .aeg-page-hero h1 { font-size: clamp(1.9rem, 4.6vw, 3rem); max-width: 22ch; }
    .aeg-breadcrumb { font-family: var(--font-mono); font-size: 0.82rem; color: var(--muted); margin-bottom: 18px; }
    .aeg-breadcrumb a { color: var(--muted); }

    /* ---------- 15. Contact and map ---------- */
    .aeg-contact-grid { display: grid; grid-template-columns: 1.1fr 0.9fr; gap: clamp(28px, 5vw, 64px); align-items: start; }
    .aeg-contact-card { padding: 32px; }
    .aeg-offices { list-style: none; display: grid; gap: 18px; margin: 24px 0 0; }
    .aeg-offices li { display: grid; grid-template-columns: 28px 1fr; gap: 12px; }
    .aeg-offices i { color: var(--magenta); margin-top: 4px; }
    .aeg-offices strong { color: var(--text); display: block; }
    .aeg-offices span { color: var(--muted); font-size: 0.95rem; }

    /* Dot-matrix world map: decorative, with a text list of offices for everyone else. */
    .aeg-map { position: relative; width: 100%; aspect-ratio: 2 / 1; border: 1px solid var(--line); border-radius: var(--radius); background: radial-gradient(circle at 50% 50%, rgba(34,229,255,0.07), transparent 70%), var(--bg-2); overflow: hidden; }
    .aeg-map svg { position: absolute; inset: 0; width: 100%; height: 100%; }
    .aeg-map__pin { position: absolute; transform: translate(-50%, -100%); display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .aeg-map__pin i { color: var(--magenta); font-size: 1.2rem; filter: drop-shadow(0 0 6px rgba(255,62,200,0.8)); }
    .aeg-map__pin span { font-family: var(--font-mono); font-size: 0.7rem; color: var(--text); background: rgba(5,7,13,0.85); border: 1px solid var(--line); padding: 2px 6px; border-radius: 4px; white-space: nowrap; }

    /* ---------- 16. Footer (fat footer) ---------- */
    .aeg-footer { border-top: 1px solid var(--line); background: linear-gradient(180deg, var(--bg), #03050a); padding-top: 64px; position: relative; }
    .aeg-footer__top { display: grid; grid-template-columns: 1.4fr 1fr 1fr 1fr 1fr; gap: 36px; }
    .aeg-footer h2 { font-family: var(--font-body); font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--text); margin-bottom: 14px; }
    .aeg-footer__links { list-style: none; display: grid; gap: 10px; }
    .aeg-footer__links a { color: var(--muted); text-decoration: none; }
    .aeg-footer__links a:hover { color: var(--cyan); text-decoration: underline; }
    .aeg-footer__brand p { font-size: 0.95rem; max-width: 36ch; }
    .aeg-social { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
    .aeg-social a { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 50%; border: 1px solid var(--line-strong); color: var(--text); font-size: 1.05rem; transition: color 0.2s, box-shadow 0.2s, border-color 0.2s; }
    .aeg-social a:hover { color: var(--cyan); border-color: var(--cyan); box-shadow: var(--glow-cyan); }
    .aeg-footer__news { margin-top: 0; }
    .aeg-footer__news .aeg-inline-form .aeg-input { min-height: 44px; }
    .aeg-footer__map { margin-top: 48px; display: grid; grid-template-columns: 1.6fr 1fr; gap: 28px; align-items: center; }
    .aeg-footer__bottom { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 14px; margin-top: 48px; padding: 22px 0 28px; border-top: 1px solid var(--line); font-size: 0.88rem; color: var(--muted); }
    .aeg-footer__bottom nav { display: flex; gap: 18px; flex-wrap: wrap; }
    .aeg-footer__bottom a { color: var(--muted); text-decoration: none; }
    .aeg-footer__bottom a:hover { color: var(--cyan); }
    .aeg-totop { background: transparent; color: var(--cyan); border: 1px solid var(--line-strong); border-radius: 999px; padding: 8px 14px; font: 600 0.85rem var(--font-body); cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
    .aeg-totop:hover { box-shadow: var(--glow-cyan); }

    /* ---------- 17. Scroll-triggered fade-in ---------- */
    [data-reveal] { opacity: 0; transform: translateY(26px); transition: opacity 0.7s var(--ease-out), transform 0.7s var(--ease-out); transition-delay: var(--reveal-delay, 0ms); }
    [data-reveal].aeg-in { opacity: 1; transform: none; }

    /* Page-level content loads with a short fade. */
    .aeg-page { animation: aeg-fade 0.4s var(--ease-out) both; }
    @keyframes aeg-fade { from { opacity: 0; } to { opacity: 1; } }

    /* ---------- 18. Responsive ---------- */
    @media (min-width: 720px) {
      .aeg-header__cta { display: inline-flex; min-height: 40px; padding: 8px 16px; font-size: 0.88rem; }
    }
    @media (max-width: 1024px) {
      .aeg-footer__top { grid-template-columns: 1fr 1fr 1fr; }
      .aeg-footer__top > :first-child { grid-column: 1 / -1; }
      .aeg-footer__map { grid-template-columns: 1fr; }
      .aeg-stats { grid-template-columns: repeat(2, 1fr); }
      .aeg-steps { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 900px) {
      .aeg-hero__grid-wrap, .aeg-split, .aeg-band, .aeg-contact-grid { grid-template-columns: 1fr; }
      .aeg-split--reverse .aeg-split__media { order: 0; }
      .aeg-hero__visual { min-height: 0; }
      .aeg-alert-card { margin-inline: auto; }
      .aeg-score { margin-top: 12px; margin-right: auto; }
      .aeg-trust__list { grid-template-columns: repeat(2, 1fr); }
      .aeg-trust__item:nth-child(3) { border-left: 0; }
      .aeg-trust__item:nth-child(n+3) { border-top: 1px solid var(--line); }
      .aeg-grid-3 { grid-template-columns: 1fr 1fr; }
      .aeg-tiers { grid-template-columns: 1fr; max-width: 480px; margin-inline: auto; }
      .aeg-tier--featured { transform: none; }
    }
    @media (max-width: 640px) {
      .aeg-footer__top { grid-template-columns: 1fr 1fr; }
      .aeg-grid-3, .aeg-steps, .aeg-stats { grid-template-columns: 1fr; }
      .aeg-form__row { grid-template-columns: 1fr; }
      .aeg-trust__list { grid-template-columns: 1fr; }
      .aeg-trust__item + .aeg-trust__item { border-left: 0; border-top: 1px solid var(--line); }
      .aeg-hero__orb { display: none; }
      .aeg-sticky-cta { left: 12px; right: 12px; bottom: 12px; justify-content: center; }
      .aeg-band .aeg-inline-form .aeg-btn { width: 100%; }
      .aeg-split__media::after { display: none; }
    }

    /* ---------- 19. Reduced motion (WCAG 2.3.3) ---------- */
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
      [data-reveal] { opacity: 1; transform: none; }
      .aeg-hero__layer { transform: none !important; }
    }
    @media (forced-colors: active) {
      .aeg-btn, .aeg-card, .aeg-acc-item { border: 1px solid CanvasText; }
    }

<body>
  <!-- Skip link: first focusable element, for keyboard and screen-reader users. -->

  <noscript>

  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useRef, useId } = React;

    /* ------------------------------------------------------------------

       ------------------------------------------------------------------ */

       ------------------------------------------------------------------ */
    const prefersReducedMotion = () =>

    // Read the current route from the hash, e.g. "#/pricing" -> "/pricing".

    const pendingAnchor = { current: null };

    // Navigate to "/page" or "/page#anchor" (or "#anchor" on the current page).

        if (anchor) scrollToId(anchor);
        return;
      }

      const el = document.getElementById(id);

       ------------------------------------------------------------------ */

    /* ------------------------------------------------------------------

      useEffect(() => {
        if (prefersReducedMotion()) return;

          frame = 0;

    /* ------------------------------------------------------------------

       pull toward the pointer. Pauses when off-screen; draws once if the
       user prefers reduced motion.
       ------------------------------------------------------------------ */
    function ParticleField({ onReady }) {
      const canvasRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;

        const ctx = canvas.getContext("2d");
        const reduce = prefersReducedMotion();
        let width = 0;

          canvas.height = Math.round(height * dpr);

          particles = Array.from({ length: count }, (_, i) => ({
            x: Math.random() * width,
            y: Math.random() * height,
            vx: (Math.random() - 0.5) * 0.35,
            vy: (Math.random() - 0.5) * 0.35,
            hue: i % 3 === 0 ? "255, 62, 200" : "34, 229, 255",
          }));
        };

        const draw = () => {
          ctx.clearRect(0, 0, width, height);
          const linkDistance = 130;
          for (const p of particles) {
            if (!reduce) {
              // Pull gently toward the pointer, then wrap at the edges.
              const dx = pointer.x - p.x;
              const dy = pointer.y - p.y;
              const dist = Math.hypot(dx, dy);
              if (dist < 160 && dist > 0.1) {
                p.vx += (dx / dist) * 0.012;
                p.vy += (dy / dist) * 0.012;
              }
              p.vx *= 0.99;
              p.vy *= 0.99;
              p.x += p.vx;
              p.y += p.vy;
              if (p.x < -10) p.x = width + 10;
              if (p.x > width + 10) p.x = -10;
              if (p.y < -10) p.y = height + 10;
              if (p.y > height + 10) p.y = -10;
            }
          }
          // Links between nearby particles
          for (let i = 0; i < particles.length; i++) {
            for (let j = i + 1; j < particles.length; j++) {
              const a = particles[i];
              const b = particles[j];

                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(a.x, a.y);
                ctx.lineTo(b.x, b.y);
                ctx.stroke();

          pointer.x = e.clientX - rect.left;

          pointer.x = -9999;

          stop();
          if (io) io.disconnect();
          window.removeEventListener("resize", onResize);
          window.removeEventListener("pointermove", onPointer);
          window.removeEventListener("pointerleave", onLeave);

    /* ------------------------------------------------------------------
       Animated counter: counts up once when scrolled into view. The final

       ------------------------------------------------------------------ */
    function CountUp({ to, suffix = "", duration = 1600 }) {

            setValue(to);
            return;
          }
          const t0 = performance.now();
          const step = (now) => {
            const p = Math.min(1, (now - t0) / duration);
            const eased = 1 - Math.pow(1 - p, 3); // ease-out cubic
            setValue(Math.round(to * eased));
            if (p < 1) requestAnimationFrame(step);
          };
          requestAnimationFrame(step);
        };
        if (!("IntersectionObserver" in window)) {
          run();
          return;
        }
        const io = new IntersectionObserver(
          ([entry]) => {
            if (entry.isIntersecting) {
              run();
              io.disconnect();
            }
          },
          { threshold: 0.5 }
        );
        io.observe(el);
        return () => io.disconnect();
      }, [to, duration]);

      return (
        <span ref={ref}>
          <span aria-hidden="true">{value.toLocaleString("en-US")}{suffix}</span>
          <span className="aeg-sr-only">{to.toLocaleString("en-US")}{suffix}</span>
        </span>
      );
    }

    /* ------------------------------------------------------------------
       Newsletter form. Validates the address, uses a honeypot field against
       bots, reports status in a live region, and never posts without an endpoint.
       ------------------------------------------------------------------ */
    function NewsletterForm({ variant = "band" }) {
      const uid = useId();
      const [email, setEmail] = useState("");
      const [status, setStatus] = useState({ state: "idle", message: "" });
      const [honeypot, setHoneypot] = useState("");
      const [error, setError] = useState("");
      const inputId = `${uid}-email`;
      const statusId = `${uid}-status`;

      async function onSubmit(event) {
        event.preventDefault();
        if (honeypot) return; // silently drop bot submissions
        const value = email.trim();
        if (!EMAIL_RE.test(value)) {
          setError("Enter a valid work email, for example name@company.com.");
          setStatus({ state: "error", message: "" });
          return;
        }
        setError("");
        if (!NEWSLETTER_ENDPOINT) {
          setStatus({
            state: "error",
            message: `Newsletter sign-up is not connected on this site yet. Email ${SALES_EMAIL} instead.`,
          });
          return;
        }
        setStatus({ state: "loading", message: "Subscribing…" });
        try {
          const res = await fetch(NEWSLETTER_ENDPOINT, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email: value, source: readRoute() }),
          });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          setEmail("");
          setStatus({ state: "success", message: "Thanks. Check your inbox to confirm your subscription." });
        } catch (err) {
          setStatus({ state: "error", message: "We could not subscribe you right now. Please try again shortly." });
        }
      }

      return (
        <form className="aeg-form aeg-inline-form" onSubmit={onSubmit} noValidate aria-describedby={statusId}>
          <div className="aeg-field" style={{ flex: "1 1 240px" }}>
            <label htmlFor={inputId} className="aeg-sr-only">Work email address</label>
            <input
              id={inputId}
              className="aeg-input"
              type="email"
              name="email"
              autoComplete="email"
              placeholder="you@company.com"
              value={email}
              onChange={(e) => setEmail(e.target.value)}
              aria-invalid={!!error}
              aria-describedby={error ? `${inputId}-err` : undefined}
              required
            />
            {error && <p id={`${inputId}-err`} className="aeg-error">{error}</p>}
          </div>
          {/* Honeypot: real visitors never see or fill this. */}
          <div className="aeg-hp" aria-hidden="true">
            <label>Leave this field empty<input type="text" name="website" tabIndex={-1} autoComplete="off" value={honeypot} onChange={(e) => setHoneypot(e.target.value)} /></label>
          </div>
          <button className={variant === "band" ? "aeg-btn aeg-btn--solid" : "aeg-btn"} type="submit" disabled={status.state === "loading"}>
            <i className="fa-solid fa-paper-plane" aria-hidden="true"></i> Subscribe
          </button>
          <p id={statusId} role="status" aria-live="polite" className={`aeg-status aeg-status--${status.state === "success" ? "ok" : status.state === "error" ? "err" : ""}`} style={{ flexBasis: "100%" }}>
            {status.message}
          </p>
        </form>
      );
    }

    function ContactPage() {
      useDocumentMeta(
        "Contact | AEGIS Threat Detection",
        "Talk to the AEGIS team about a demo, a deployment or support. Find our offices in Hyderabad, London, Singapore and Austin."
      );
      const uid = useId();
      const [form, setForm] = useState({ name: "", email: "", company: "", topic: "demo", message: "", consent: false, website: "" });
      const [errors, setErrors] = useState({});
      const [status, setStatus] = useState({ state: "idle", message: "" });
      const statusId = `${uid}-status`;

      const update = (key) => (e) => {
        const value = e.target.type === "checkbox" ? e.target.checked : e.target.value;
        setForm((f) => ({ ...f, [key]: value }));
      };

      function validate() {
        const next = {};
        if (form.name.trim().length < 2) next.name = "Enter your name.";
        if (!EMAIL_RE.test(form.email.trim())) next.email = "Enter a valid work email address.";
        if (form.message.trim().length < 10) next.message = "Tell us a little more, at least 10 characters.";
        if (!form.consent) next.consent = "Please confirm you agree to be contacted.";
        return next;
      }

      async function onSubmit(event) {
        event.preventDefault();
        if (form.website) return; // honeypot
        const next = validate();
        setErrors(next);
        const firstKey = Object.keys(next)[0];
        if (firstKey) {
          document.getElementById(`${uid}-${firstKey}`).focus();
          setStatus({ state: "error", message: "Please fix the highlighted fields." });
          return;
        }
        if (!CONTACT_ENDPOINT) {
          setStatus({ state: "error", message: `The contact form is not connected on this site yet. Email ${SALES_EMAIL} instead.` });
          return;
        }
        setStatus({ state: "loading", message: "Sending…" });
        try {
          const res = await fetch(CONTACT_ENDPOINT, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ ...form, website: undefined }),
          });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          setForm({ name: "", email: "", company: "", topic: "demo", message: "", consent: false, website: "" });
          setStatus({ state: "success", message: "Thanks. A member of the team will reply within one business day." });
        } catch (err) {
          setStatus({ state: "error", message: "We could not send your message. Please try again or email us directly." });
        }
      }

      const invalid = (key) => (errors[key] ? { "aria-invalid": true, "aria-describedby": `${uid}-${key}-err` } : {});

      return (
        <main id="main" className="aeg-page" tabIndex={-1}>
          <PageHero
            crumb="Contact"
            title="Talk to the team that builds the detection engine"
            lead="Book a demo, ask about deployment, or report a security issue. Engineers answer; sales staff do not screen you."
          />
          <section className="aeg-section" style={{ paddingTop: 0 }} aria-labelledby="contact-title">
            <div className="aeg-container aeg-contact-grid">
              <div className="aeg-card aeg-contact-card" data-reveal>
                <h2 id="contact-title" style={{ fontSize: "1.5rem" }}>Send us a message</h2>
                <form className="aeg-form" onSubmit={onSubmit} noValidate aria-describedby={statusId}>
                  <div className="aeg-form__row">
                    <div className="aeg-field">
                      <label htmlFor={`${uid}-name`}>Full name</label>
                      <input id={`${uid}-name`} className="aeg-input" name="name" autoComplete="name" value={form.name} onChange={update("name")} {...invalid("name")} />
                      {errors.name && <p id={`${uid}-name-err`} className="aeg-error">{errors.name}</p>}
                    </div>
                    <div className="aeg-field">
                      <label htmlFor={`${uid}-email`}>Work email</label>
                      <input id={`${uid}-email`} className="aeg-input" type="email" name="email" autoComplete="email" value={form.email} onChange={update("email")} {...invalid("email")} />
                      {errors.email && <p id={`${uid}-email-err`} className="aeg-error">{errors.email}</p>}
                    </div>
                  </div>
                  <div className="aeg-form__row">
                    <div className="aeg-field">
                      <label htmlFor={`${uid}-company`}>Company <span className="aeg-field__hint">(optional)</span></label>
                      <input id={`${uid}-company`} className="aeg-input" name="company" autoComplete="organization" value={form.company} onChange={update("company")} />
                    </div>
                    <div className="aeg-field">
                      <label htmlFor={`${uid}-topic`}>What do you need?</label>
                      <select id={`${uid}-topic`} className="aeg-input" name="topic" value={form.topic} onChange={update("topic")}>
                        <option value="demo">Book a demo</option>
                        <option value="deploy">Deployment help</option>
                        <option value="support">Product support</option>
                        <option value="security">Report a security issue</option>
                      </select>
                    </div>
                  </div>
                  <div className="aeg-field">
                    <label htmlFor={`${uid}-message`}>Message</label>
                    <textarea id={`${uid}-message`} className="aeg-input" name="message" value={form.message} onChange={update("message")} {...invalid("message")} />
                    {errors.message && <p id={`${uid}-message-err`} className="aeg-error">{errors.message}</p>}
                  </div>
                  <div className="aeg-field">
                    <label className="aeg-consent" htmlFor={`${uid}-consent`}>
                      <input id={`${uid}-consent`} type="checkbox" name="consent" checked={form.consent} onChange={update("consent")} {...invalid("consent")} />
                      <span>I agree that AEGIS may contact me about this request. We never sell contact details. See the privacy policy.</span>
                    </label>
                    {errors.consent && <p id={`${uid}-consent-err`} className="aeg-error">{errors.consent}</p>}
                  </div>
                  {/* Honeypot */}
                  <div className="aeg-hp" aria-hidden="true">
                    <label>Website<input type="text" tabIndex={-1} autoComplete="off" value={form.website} onChange={update("website")} /></label>
                  </div>
                  <div>
                    <button className="aeg-btn aeg-btn--solid" type="submit" disabled={status.state === "loading"}>
                      <i className="fa-solid fa-paper-plane" aria-hidden="true"></i> Send message
                    </button>
                  </div>
                  <p id={statusId} role="status" aria-live="polite" className={`aeg-status aeg-status--${status.state === "success" ? "ok" : status.state === "error" ? "err" : ""}`}>
                    {status.message}
                  </p>
                </form>
              </div>

              <aside aria-labelledby="direct-title" data-reveal style={{ "--reveal-delay": "120ms" }}>
                <h2 id="direct-title" style={{ fontSize: "1.5rem" }}>Reach us directly</h2>
                <p>
                  Email <a href={`mailto:${SALES_EMAIL}`}>{SALES_EMAIL}</a> for sales, or
                  {" "}<a href="mailto:security@aegis.example">security@aegis.example</a> for vulnerability reports.
                </p>
                <p>Support hours for Team and Enterprise customers are published in your order form.</p>
                <ul className="aeg-offices">
                  {OFFICES.map((o) => (
                    <li key={o.city}>
                      <i className="fa-solid fa-location-dot" aria-hidden="true"></i>
                      <div><strong>{o.city}, {o.country}</strong><span>{o.note}</span></div>
                    </li>
                  ))}
                </ul>
              </aside>
            </div>
          </section>

          <section className="aeg-section aeg-section--alt" aria-labelledby="map-title">
            <div className="aeg-container">
              <div style={{ maxWidth: 680, marginBottom: 32 }} data-reveal>
                <span className="aeg-eyebrow">Offices</span>
                <h2 id="map-title">Four offices, one support queue</h2>
              </div>
              <div data-reveal><DotMap /></div>
            </div>
          </section>
        </main>
      );
    }

    /* ------------------------------------------------------------------
       PAGE: 404
       ------------------------------------------------------------------ */
    function NotFoundPage() {
      useDocumentMeta("Page not found | AEGIS", "The page you were looking for does not exist.");
      return (
        <main id="main" className="aeg-page" tabIndex={-1}>
          <section className="aeg-page-hero" style={{ textAlign: "center" }}>
            <div className="aeg-container">
              <span className="aeg-eyebrow">Error 404</span>
              <h1>This page is not in our logs.</h1>
              <p className="aeg-lead" style={{ margin: "0 auto" }}>The link may be out of date. Try the home page or the features list.</p>
              <div className="aeg-btn-row" style={{ justifyContent: "center" }}>
                <a className="aeg-btn aeg-btn--solid" href="#/" onClick={(e) => { e.preventDefault(); navigate("/"); }}>Go home</a>
              </div>
            </div>
          </section>
        </main>
      );
    }

    /* ------------------------------------------------------------------
       App shell: picks the page for the current route.
       ------------------------------------------------------------------ */
    const ROUTES = {
      "/": HomePage,
      "/features": FeaturesPage,
      "/pricing": PricingPage,
      "/contact": ContactPage,
    };

    function App() {
      const route = useRoute();
      useReveal(route);
      useParallax(route);

      // After a route change, scroll to a pending anchor, e.g. "#/#detect".
      useEffect(() => {
        if (!pendingAnchor.current) return;
        const id = pendingAnchor.current;
        pendingAnchor.current = null;
        requestAnimationFrame(() => scrollToId(id));
      }, [route]);

      const Page = ROUTES[route] || NotFoundPage;
      return (
        <>
          <SiteHeader route={route} />
          <Page />
          <StickyCta route={route} />
          <SiteFooter />
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
