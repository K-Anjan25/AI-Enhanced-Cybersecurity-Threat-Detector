name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests
        run: pytest

  ml-service:
    name: ML service import check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ml-service/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Smoke import
        run: python -c "from app.main import app; print('ml-service imports OK')"
      - name: Run tests
        run: pytest

  dashboard:
    name: Dashboard typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck + build
        run: npm run build

  k8s:
    name: K8s manifest validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bmuschko/setup-kubeconform@v1
        with:
          kubeconform-version: "0.6.3"
      - name: Validate manifests
        run: |
          kubeconform -summary -verbose -strict -ignore-missing-schemas k8s/

  loadtest:
    name: Load test (k6 vs compose stack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build + boot stack (postgres + backend + ml-service)
        run: |
          docker compose -f docker/docker-compose.yml up -d --build postgres backend ml-service
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8000/health/ready >/dev/null 2>&1 \
               && curl -sf http://localhost:8001/health >/dev/null 2>&1; then
              echo "stack ready after ${i}x5s"
              break
            fi
            sleep 5
          done
          curl -sf http://localhost:8000/health/ready >/dev/null
          curl -sf http://localhost:8001/health >/dev/null
      - name: Install k6
        run: |
          curl -sL https://github.com/grafana/k6/releases/download/v0.52.0/k6-v0.52.0-linux-amd64.tar.gz | tar -xz
          echo "$PWD/k6-v0.52.0-linux-amd64" >> "$GITHUB_PATH"
      - name: Run k6 NFR-PERF suite
        env:
          BASE_HOST: http://localhost:8000
          ML_HOST: http://localhost:8001
          TOKENPASS: "ChangeMe#2026"
          CI: "true"
        run: k6 run loadtest/k6/threat-ai.js