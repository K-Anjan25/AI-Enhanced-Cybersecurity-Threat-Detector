[alembic]
script_location = alembic
prepend_sys_path = .
# The URL is taken from the environment at runtime; a hardcoded connection string
# in version control would be a credential and would also be wrong in every
# environment but one.
sqlalchemy.url =

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
