[project]
name = "aegis-backend"
version = "0.1.0"
description = "AEGIS — AI-Enhanced Cybersecurity Threat Detector: ingest and query API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.142",
    "uvicorn>=0.40",
    "pydantic>=2.13",
    "pydantic-settings>=2.13",
    "structlog>=26.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1",
    "httpx>=0.28",
    "ruff>=0.16",
    "black>=26.5",
    "mypy>=2.4",
    "bandit>=1.9",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

# --- ruff (R-12) -----------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",     # pycodestyle
    "F",          # pyflakes
    "I",          # isort
    "UP",         # pyupgrade
    "B",          # bugbear
    "C4",         # comprehensions
    "SIM",        # simplify
    "D",          # pydocstyle (R-02)
    "S",          # bandit rules in-linter
    "BLE",        # no blind except
    "ASYNC",      # async correctness (R-18)
]
ignore = [
    "D203",  # conflicts with D211
    "D213",  # conflicts with D212
]

[tool.ruff.lint.per-file-ignores]
# Tests hold deliberately fake credentials and invoke the interpreter directly.
"tests/**" = ["D100", "D101", "D102", "D103", "D104", "S101", "S105", "S106", "S603"]

[tool.ruff.lint.pydocstyle]
convention = "google"

# --- black (R-12) ----------------------------------------------------------
[tool.black]
line-length = 100
target-version = ["py311"]

# --- mypy (R-11) -----------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
files = ["app"]

[[tool.mypy.overrides]]
module = ["uvicorn.*"]
ignore_missing_imports = true

# --- pytest (R-80..R-89) ---------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "dataset: tests that require the real UNSW-NB15 / CIC-IDS2017 datasets (skipped by default, R-84)",
]

# --- coverage gate (R-80) --------------------------------------------------
[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true

# --- bandit (R-50, R-51, R-17) ---------------------------------------------
[tool.bandit]
exclude_dirs = ["tests", ".venv"]

# --- import boundaries (R-15, T-009) ---------------------------------------
[tool.importlinter]
root_packages = ["app"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Services must not import the web framework (R-15)"
type = "forbidden"
source_modules = ["app.services"]
forbidden_modules = ["fastapi", "starlette"]
reason = "Business logic must be testable without an HTTP server."

[[tool.importlinter.contracts]]
name = "Schemas must not reach into services or the database"
type = "forbidden"
source_modules = ["app.schemas"]
forbidden_modules = ["app.services", "sqlalchemy"]
reason = "Schemas are the wire contract; they must stay declarative."
