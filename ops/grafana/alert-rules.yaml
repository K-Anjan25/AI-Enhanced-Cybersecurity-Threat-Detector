# T-505: Grafana alert rules for AEGIS operational monitoring.
#
# These alerts fire in a drill when the AEGIS system itself is unhealthy.
# Deploy: kubectl apply -f ops/grafana/alert-rules.yaml
# Or import via Grafana API/provisioning.

apiVersion: grafana.com/v1alpha1
kind: GrafanaAlertRuleGroup
metadata:
  name: aegis-operational-alerts
  namespace: monitoring
spec:
  folder: AEGIS
  interval: 60s
  rules:
    # ── Consumer lag alert ──────────────────────
    - alert: AEGISConsumerLagHigh
      expr: aegis_consumer_lag > 10000
      for: 5m
      labels:
        severity: warning
        service: aegis
      annotations:
        summary: "Kafka consumer lag exceeds 10,000"
        description: "Consumer lag for {{ $labels.topic }} is {{ $value }}. Scoring is delayed."

    # ── Scoring latency alert ───────────────────
    - alert: AEGISScoringLatencyHigh
      expr: histogram_quantile(0.95, rate(aegis_score_latency_seconds_bucket[5m])) > 1.0
      for: 3m
      labels:
        severity: warning
        service: aegis
      annotations:
        summary: "Scoring p95 latency exceeds 1 second"
        description: "p95 latency is {{ $value }}s (budget: 1s). Check ML service health."

    # ── Drift PSI alert ─────────────────────────
    - alert: AEGISDriftPSIHigh
      expr: aegis_drift_psi > 0.25
      for: 10m
      labels:
        severity: warning
        service: aegis
      annotations:
        summary: "Feature drift PSI exceeds threshold (FR-32)"
        description: "{{ $labels.feature }} PSI is {{ $value }} (threshold: 0.25). Retraining may be needed."

    # ── Error rate alert ────────────────────────
    - alert: AEGISErrorRateHigh
      expr: rate(aegis_errors_total[5m]) / rate(aegis_requests_total[5m]) > 0.01
      for: 5m
      labels:
        severity: critical
        service: aegis
      annotations:
        summary: "AEGIS error rate exceeds 1%"
        description: "Error rate is {{ $value | humanizePercentage }}. Investigation required."

    # ── Model score distribution shift ──────────
    - alert: AEGISModelScoreShift
      expr: abs(avg_over_time(aegis_score_mean[1h]) - avg_over_time(aegis_score_mean[24h])) > 0.2
      for: 30m
      labels:
        severity: info
        service: aegis
      annotations:
        summary: "Model score distribution may be shifting"
        description: "1h mean differs from 24h mean by {{ $value }}. Check drift page."
